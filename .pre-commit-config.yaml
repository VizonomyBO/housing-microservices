repos:
  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        files: ^services/(auth-service|user-service)/
        exclude: ^services/(auth-service|user-service)/(\.venv|venv|\.pytest_cache|htmlcov)/
        
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^services/(auth-service|user-service)/
        exclude: ^services/(auth-service|user-service)/(\.venv|venv|\.pytest_cache|htmlcov)/
        args: ["--profile", "black"]
        
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: ^services/auth-service/
        exclude: ^services/auth-service/(\.venv|venv|\.pytest_cache|htmlcov)/
        args: ["--config=services/auth-service/.flake8"]
      - id: flake8
        files: ^services/user-service/
        exclude: ^services/user-service/(\.venv|venv|\.pytest_cache|htmlcov)/
        args: ["--config=services/user-service/setup.cfg"]
        
  # TypeScript/JavaScript formatting and linting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^services/swagger-service/.*\.(ts|js|json)$
        exclude: ^services/swagger-service/(node_modules|dist|coverage)/
        
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^services/swagger-service/.*\.(ts|js)$
        exclude: ^services/swagger-service/(node_modules|dist|coverage)/
        additional_dependencies:
          - "@typescript-eslint/parser@6.18.0"
          - "@typescript-eslint/eslint-plugin@6.18.0"
          - "eslint-config-prettier@9.1.0"
          - "eslint-plugin-prettier@5.1.2"
          - "eslint-plugin-security@2.1.0"
        
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|txt)$
      - id: end-of-file-fixer
        exclude: \.(md|txt)$
      - id: check-yaml
        exclude: ^\.github/
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
        
  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        files: ^services/(auth-service|user-service)/app/
        args: ["-ll", "-i"]
        
  # Docker
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        files: Dockerfile

