x-ec2-defaults: &ec2-defaults
  env_file:
    - ${ENV_FILE:-.env.prod}
  restart: unless-stopped
  networks:
    - ec2-net
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  agent-api:
    <<: *ec2-defaults
    user: root
    build:
      context: .
      dockerfile: services/agent-api/Dockerfile.reduced
    environment:
      STACK_PROFILE: ${STACK_PROFILE:-prod}
      SERVICE_MODE: ${SERVICE_MODE:-prod}
      DATABASE_URL: ${DATABASE_URL}
      INGEST_BASE_URL: ${AGENT_INGEST_BASE_URL:-http://ingestion-service:8085}
      INGEST_UPLOAD_API_KEY: ${INGEST_UPLOAD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-context-3}
      VOYAGE_EMBEDDING_DIMENSIONS: ${VOYAGE_EMBEDDING_DIMENSIONS:-1024}
      VOYAGE_RERANK_MODEL: ${VOYAGE_RERANK_MODEL:-rerank-2.5}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-${AUTH_INTERNAL_BASE_URL:-${AUTH_BASE_URL:-http://auth-service:5000}}}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-agent-api}
      AUTH_SHARED_SECRET: ${AUTH_SHARED_SECRET:-${JWT_SECRET_KEY:-}}
      AUTH_JWT_ALGORITHMS: ${AUTH_JWT_ALGORITHMS:-RS256,HS256}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_JWKS_CACHE_SECONDS: ${AUTH_JWKS_CACHE_SECONDS:-3600}
      AUTH_JWT_LEEWAY_SECONDS: ${AUTH_JWT_LEEWAY_SECONDS:-60}
      AUTH_REQUIRED_SCOPES: ${AUTH_REQUIRED_SCOPES:-}
      AUTH_SCOPE_CLAIM: ${AUTH_SCOPE_CLAIM:-scope}
      AUTH_TENANT_CLAIM: ${AUTH_TENANT_CLAIM:-tenant_id}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AGENT_API_CORS_ORIGINS: ${AGENT_API_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      METRICS_NAMESPACE: ${METRICS_NAMESPACE:-agent-api}
      METRICS_AUTH_HEADER: ${METRICS_AUTH_HEADER:-Authorization}
      METRICS_AUTH_SCHEME: ${METRICS_AUTH_SCHEME:-Bearer}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      USE_LOCALSTACK: ${USE_LOCALSTACK:-0}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      UV_CACHE_DIR: /tmp/uv-cache
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "${AGENT_API_PORT:-8000}"
      - --app-dir
      - src
      - --workers
      - "${UVICORN_WORKERS:-1}"
    ports:
      - "${AGENT_API_PORT:-8000}:8000"
    depends_on:
      ingestion-service:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ingestion-service:
    <<: *ec2-defaults
    user: root
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AUTH_BASE_URL: ${AUTH_INTERNAL_BASE_URL:-${AUTH_BASE_URL:-http://auth-service:5000}}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-context-3}
      VOYAGE_OUTPUT_DIMENSION: ${VOYAGE_OUTPUT_DIMENSION:-1024}
      VECTOR_STORE_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      SIGNING_SECRET: ${SIGNING_SECRET:-${JWT_SECRET_KEY:-}}
      UV_CACHE_DIR: /tmp/uv-cache
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
    command:
      - uvicorn
      - ingestion_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${INGESTION_SERVICE_PORT:-8085}"
    ports:
      - "${INGESTION_SERVICE_PORT:-8085}:8085"
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  auth-service:
    <<: *ec2-defaults
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT:-5001}:5000"
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      PORT: 5000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_REGION: ${SES_REGION:-us-east-1}
      SES_SOURCE_EMAIL: ${SES_SOURCE_EMAIL:-addis@vizonomy.com}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://52.207.140.87/reset-password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  user-service:
    <<: *ec2-defaults
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "${USER_SERVICE_PORT:-5002}:5001"
    depends_on:
      - auth-service
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PORT: 5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx-gateway:
    <<: *ec2-defaults
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./ArchaaS/configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /housing-frontend/build/client:/housing-frontend/dist:ro
    depends_on:
      - auth-service
      - user-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ec2-net:
    driver: bridge
