x-ec2-defaults: &ec2-defaults
  env_file:
    - ${ENV_FILE:-.env.prod}
  restart: unless-stopped
  networks:
    - ec2-net
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    <<: *ec2-defaults
    image: pgvector/pgvector:pg16
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/postgresql/16/bin
      POSTGRES_USER: ${POSTGRES_USER:-vizonomy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-housing}
      AUTH_DB: ${AUTH_DB:-auth_db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repo_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vizonomy_user} -d ${POSTGRES_DB:-housing} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  init-migrations:
    <<: *ec2-defaults
    build:
      context: .
      dockerfile: docker/init-migrations/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST_INTERNAL:-postgres}:5432/${POSTGRES_DB:-housing}
      DB_HOST: ${DB_HOST_INTERNAL:-postgres}
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-housing}
      DB_USER: ${POSTGRES_USER:-vizonomy_user}
      REVISION: ${ALEMBIC_REVISION:-head}
    restart: "no"

  agent-api:
    <<: *ec2-defaults
    user: root
    build:
      context: .
      dockerfile: services/agent-api/Dockerfile.reduced
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST_INTERNAL:-postgres}:5432/${POSTGRES_DB:-housing}
      INGEST_BASE_URL: ${AGENT_INGEST_BASE_URL:-http://ingestion-service:8085}
      INGEST_UPLOAD_API_KEY: ${INGEST_UPLOAD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-context-3}
      VOYAGE_EMBEDDING_DIMENSIONS: ${VOYAGE_EMBEDDING_DIMENSIONS:-1024}
      VOYAGE_RERANK_MODEL: ${VOYAGE_RERANK_MODEL:-rerank-2.5}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-${AUTH_INTERNAL_BASE_URL:-${AUTH_BASE_URL:-http://auth-service:5000}}}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-agent-api}
      AUTH_SHARED_SECRET: ${AUTH_SHARED_SECRET:-${JWT_SECRET_KEY:-}}
      AUTH_JWT_ALGORITHMS: ${AUTH_JWT_ALGORITHMS:-RS256,HS256}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_JWKS_CACHE_SECONDS: ${AUTH_JWKS_CACHE_SECONDS:-3600}
      AUTH_JWT_LEEWAY_SECONDS: ${AUTH_JWT_LEEWAY_SECONDS:-60}
      AUTH_REQUIRED_SCOPES: ${AUTH_REQUIRED_SCOPES:-}
      AUTH_SCOPE_CLAIM: ${AUTH_SCOPE_CLAIM:-scope}
      AUTH_TENANT_CLAIM: ${AUTH_TENANT_CLAIM:-tenant_id}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AGENT_API_CORS_ORIGINS: ${AGENT_API_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      UV_CACHE_DIR: /tmp/uv-cache
    ports:
      - "${AGENT_API_PORT:-8000}:8000"
    command:
      - /bin/sh
      - -c
      - /app/services/agent-api/.venv/bin/uvicorn main:app --host 0.0.0.0 --port ${AGENT_API_PORT:-8000} --workers ${UVICORN_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      init-migrations:
        condition: service_completed_successfully
      ingestion-service:
        condition: service_started
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ingestion-service:
    <<: *ec2-defaults
    user: root
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST_INTERNAL:-postgres}:5432/${POSTGRES_DB:-housing}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AUTH_BASE_URL: ${AUTH_INTERNAL_BASE_URL:-${AUTH_BASE_URL:-http://auth-service:5000}}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-context-3}
      VOYAGE_OUTPUT_DIMENSION: ${VOYAGE_OUTPUT_DIMENSION:-1024}
      VECTOR_STORE_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      SIGNING_SECRET: ${SIGNING_SECRET:-${JWT_SECRET_KEY:-}}
      UV_CACHE_DIR: /tmp/uv-cache
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${INGESTION_SERVICE_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      init-migrations:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  auth-service:
    <<: *ec2-defaults
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT:-5001}:5000"
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST_INTERNAL:-postgres}:5432/${AUTH_DB:-auth_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      PORT: 5000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_REGION: ${SES_REGION:-us-east-1}
      SES_SOURCE_EMAIL: ${SES_SOURCE_EMAIL:-addis@vizonomy.com}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://52.207.140.87/reset-password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  user-service:
    <<: *ec2-defaults
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "${USER_SERVICE_PORT:-5002}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST_INTERNAL:-postgres}:5432/${AUTH_DB:-auth_db}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PORT: 5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  ec2-net:
    driver: bridge
volumes:
  repo_postgres_data:
