version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: account-postgres
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - microservices-network

  auth-service:
    build: 
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://account_user:secure_password@postgres:5432/account_db
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ACCESS_TOKEN_EXPIRES=900
      - JWT_REFRESH_TOKEN_EXPIRES=2592000
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - microservices-network

  user-service:
    build: 
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "5002:5001"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://account_user:secure_password@postgres:5432/account_db
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ACCESS_TOKEN_EXPIRES_MINUTES=15
      - AUTH_SERVICE_URL=http://auth-service:5000
      - FLASK_ENV=production
      - PORT=5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - microservices-network

  swagger-service:
    build: 
      context: ./services/swagger-service
      dockerfile: Dockerfile
    container_name: swagger-service
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - ACCOUNT_SERVICE_URL=http://auth-service:5000
      - USER_SERVICE_URL=http://user-service:5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge

