x-service-defaults: &service-defaults
  env_file:
    - ${ENV_FILE:-.env.local}
  restart: unless-stopped
  networks:
    - housing-net

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg16
    container_name: housing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-housing}
      POSTGRES_USER: ${POSTGRES_USER:-vizonomy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_DB: ${AUTH_DB:-auth_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vizonomy_user} -d ${POSTGRES_DB:-housing}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/agent-api/Dockerfile.reduced
    container_name: db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-housing}}
    command: >-
      bash -c "uv run python /app/packages/shared_data_layer/src/shared_data_layer/manage.py migrate"
    restart: "no"

  localstack:
    <<: *service-defaults
    image: localstack/localstack:latest
    container_name: localstack
    environment:
      SERVICES: ${LOCALSTACK_SERVICES:-s3,sns,sqs,secretsmanager,events}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      EDGE_PORT: ${LOCALSTACK_EDGE_PORT:-4566}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "${LOCALSTACK_EDGE_PORT:-4566}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  auth-service:
    <<: *service-defaults
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "${AUTH_SERVICE_PORT:-5001}:5000"
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${AUTH_DB:-auth_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-900}
      JWT_REFRESH_TOKEN_EXPIRES: ${JWT_REFRESH_TOKEN_EXPIRES:-2592000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SES_REGION: ${SES_REGION:-us-east-1}
      SES_SOURCE_EMAIL: ${SES_SOURCE_EMAIL:-noreply@example.com}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      PORT: 5000
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  user-service:
    <<: *service-defaults
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "${USER_SERVICE_PORT:-5002}:5001"
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${AUTH_DB:-auth_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-15}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:5000}
      PORT: 5001
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ingestion-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: ingestion-service
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${INGESTION_SERVICE_PORT:-8085}:8085"
    environment:
      DATABASE_URL: ${HOUSING_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-housing}}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret}
      AUTH_BASE_URL: ${AUTH_INTERNAL_BASE_URL:-${AUTH_BASE_URL:-http://auth-service:5000}}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-context-3}
      VOYAGE_OUTPUT_DIMENSION: ${VOYAGE_OUTPUT_DIMENSION:-1024}
      VECTOR_STORE_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      SIGNING_SECRET: ${SIGNING_SECRET:-${JWT_SECRET_KEY:-dev-secret}}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-localstack}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-localstack}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  agent-api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/agent-api/Dockerfile.reduced
    container_name: agent-api
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "${AGENT_API_PORT:-8000}:8000"
    environment:
      STACK_PROFILE: ${STACK_PROFILE:-dev}
      SERVICE_MODE: ${SERVICE_MODE:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-vizonomy_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-housing}}
      INGEST_BASE_URL: ${AGENT_INGEST_BASE_URL:-http://ingestion-service:8085}
      INGEST_UPLOAD_API_KEY: ${INGEST_UPLOAD_API_KEY:-}
      METRICS_NAMESPACE: ${METRICS_NAMESPACE:-agent-api}
      METRICS_AUTH_HEADER: ${METRICS_AUTH_HEADER:-Authorization}
      METRICS_AUTH_SCHEME: ${METRICS_AUTH_SCHEME:-Bearer}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-context-3}
      VOYAGE_EMBEDDING_DIMENSIONS: ${VOYAGE_EMBEDDING_DIMENSIONS:-1024}
      VOYAGE_RERANK_MODEL: ${VOYAGE_RERANK_MODEL:-rerank-2.5}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-${AUTH_INTERNAL_BASE_URL:-http://auth-service:5000}}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-agent-api}
      AUTH_SHARED_SECRET: ${AUTH_SHARED_SECRET:-${JWT_SECRET_KEY:-dev-secret}}
      AUTH_JWT_ALGORITHMS: ${AUTH_JWT_ALGORITHMS:-RS256,HS256}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_JWKS_CACHE_SECONDS: ${AUTH_JWKS_CACHE_SECONDS:-3600}
      AUTH_JWT_LEEWAY_SECONDS: ${AUTH_JWT_LEEWAY_SECONDS:-60}
      AUTH_REQUIRED_SCOPES: ${AUTH_REQUIRED_SCOPES:-}
      AUTH_SCOPE_CLAIM: ${AUTH_SCOPE_CLAIM:-scope}
      AUTH_TENANT_CLAIM: ${AUTH_TENANT_CLAIM:-tenant_id}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AGENT_API_CORS_ORIGINS: ${AGENT_API_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AGENT_API_CORS_ALLOW_CREDENTIALS: ${AGENT_API_CORS_ALLOW_CREDENTIALS:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-localstack}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-localstack}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  localstack_data:

networks:
  housing-net:
    driver: bridge
