name: Quality Checks

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  # Detect which services have changes
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      agent-api: ${{ steps.filter.outputs.agent-api }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      ingestion-service: ${{ steps.filter.outputs.ingestion-service }}
      job-service: ${{ steps.filter.outputs.job-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
      shared-data-layer: ${{ steps.filter.outputs.shared-data-layer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent-api:
              - 'services/agent-api/**'
            auth-service:
              - 'services/auth-service/**'
            ingestion-service:
              - 'services/ingestion-service/**'
            job-service:
              - 'services/job-service/**'
            user-service:
              - 'services/user-service/**'
            shared-data-layer:
              - 'packages/shared_data_layer/**'

  # Linting runs on whole repo (fast, catches cross-cutting issues)
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.13
      # Install from agent-api (has most deps) for tooling
      - name: Install dependencies
        working-directory: services/agent-api
        run: uv sync --all-extras
      - name: Ruff format check
        working-directory: services/agent-api
        run: uv run ruff format --check ../..
      - name: Ruff linter
        working-directory: services/agent-api
        run: uv run ruff check ../..

  # Type checking runs on whole repo
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.13
      - name: Install dependencies
        working-directory: services/agent-api
        run: uv sync --all-extras
      - name: Ty type checker
        working-directory: services/agent-api
        run: uv run ty check ../..

  # Tests for agent-api (uv-managed, needs shared-data-layer)
  test-agent-api:
    name: Test agent-api
    needs: detect-changes
    if: needs.detect-changes.outputs.agent-api == 'true' || needs.detect-changes.outputs.shared-data-layer == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.13
      - name: Install dependencies (links shared-data-layer)
        working-directory: services/agent-api
        run: uv sync --all-extras
      - name: Run tests
        working-directory: services/agent-api
        run: uv run pytest tests -n auto

  # Tests for auth-service (pip/requirements.txt based)
  test-auth-service:
    name: Test auth-service
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-xdist
      - name: Run tests
        run: pytest tests -n auto

  # Tests for ingestion-service (uv-managed, needs shared-data-layer)
  test-ingestion-service:
    name: Test ingestion-service
    needs: detect-changes
    if: needs.detect-changes.outputs.ingestion-service == 'true' || needs.detect-changes.outputs.shared-data-layer == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.13
      - name: Install dependencies (links shared-data-layer)
        working-directory: services/ingestion-service
        run: uv sync --all-extras
      - name: Run tests
        working-directory: services/ingestion-service
        run: uv run pytest tests -n auto

  # Tests for job-service (uv-managed, standalone)
  test-job-service:
    name: Test job-service
    needs: detect-changes
    if: needs.detect-changes.outputs.job-service == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.13
      - name: Install dependencies
        working-directory: services/job-service
        run: uv sync --all-extras
      - name: Run tests
        working-directory: services/job-service
        run: uv run pytest tests -n auto

  # Tests for shared-data-layer package
  test-shared-data-layer:
    name: Test shared-data-layer
    needs: detect-changes
    if: needs.detect-changes.outputs.shared-data-layer == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.13
      - name: Install dependencies
        working-directory: packages/shared_data_layer
        run: uv sync --all-extras
      - name: Run tests
        working-directory: packages/shared_data_layer
        run: uv run pytest tests -n auto
