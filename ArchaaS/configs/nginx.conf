# Vizonomy API Gateway - Nginx Reverse Proxy
# All APIs follow pattern: /api/{service}/...

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream auth_service {
        server auth-service:5000;
    }

    upstream user_service {
        server user-service:5001;
    }

    upstream swagger_service {
        server host.docker.internal:3001;
    }

    upstream frontend_service {
        server frontend-service:3000;
    }

    upstream agent_api {
        server agent-api:8000;
    }

    upstream ingestion_service {
        server ingestion-service:8085;
    }

    upstream job_service {
        server job-service:8090;
    }

    server {
        listen 80;
        server_name _;

        # Logging
        access_log /var/log/nginx/vizonomy_access.log main;
        error_log /var/log/nginx/vizonomy_error.log;

        # Health check endpoint
        location /health {
            return 200 '{"status":"healthy","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }

        # =================================================================
        # API ROUTES - All follow /api/{service}/...
        # =================================================================

        # Auth Service: /api/auth/v1/auth/... → /v1/auth/...
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service: /api/users/v1/users/... → /v1/users/...
        location /api/users/ {
            proxy_pass http://user_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chat/Agent API: /api/chat/v1/... → /v1/...
        location /api/chat/ {
            proxy_pass http://agent_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # Ingestion Service: /api/ingestion/v1/... → /v1/...
        location /api/ingestion/ {
            proxy_pass http://ingestion_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Support for file downloads
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 100M;
        }

        # Job Service: /api/jobs/... → /...
        location /api/jobs/ {
            proxy_pass http://job_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger/Docs: /api/docs/...
        location /api/docs/ {
            proxy_pass http://swagger_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =================================================================
        # FRONTEND - Proxy to React Router SSR server
        # =================================================================

        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


