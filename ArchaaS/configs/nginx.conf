# Vizonomy API Gateway - Nginx Reverse Proxy
# All APIs follow pattern: /api/{service}/...

upstream auth_service {
    server host.docker.internal:5001;
}

upstream user_service {
    server host.docker.internal:5002;
}

upstream swagger_service {
    server host.docker.internal:3001;
}

upstream frontend_service {
    server host.docker.internal:3000;
}

upstream agent_api {
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name _;

    # Logging
    access_log /var/log/nginx/vizonomy_access.log;
    error_log /var/log/nginx/vizonomy_error.log;

    # Health check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    # =================================================================
    # API ROUTES - All follow /api/{service}/...
    # =================================================================

    # Auth Service: /api/auth/v1/auth/... → /v1/auth/...
    location /api/auth/ {
        proxy_pass http://auth_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Service: /api/users/v1/users/... → /v1/users/...
    location /api/users/ {
        proxy_pass http://user_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat/Agent API: /api/chat/v1/... → /v1/...
    location /api/chat/ {
        proxy_pass http://agent_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # Swagger/Docs: /api/docs/...
    location /api/docs/ {
        proxy_pass http://swagger_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =================================================================
    # FRONTEND - Proxy to React Router SSR server
    # =================================================================

    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


