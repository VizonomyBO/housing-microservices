# Vizonomy API Gateway - Nginx Reverse Proxy
# All APIs follow pattern: /api/{service}/...

upstream auth_service {
    server 127.0.0.1:5001;
}

upstream user_service {
    server 127.0.0.1:5002;
}

upstream swagger_service {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;

    # Logging
    access_log /var/log/nginx/vizonomy_access.log;
    error_log /var/log/nginx/vizonomy_error.log;

    # Health check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    # =================================================================
    # API ROUTES - All follow /api/{service}/...
    # =================================================================

    # Auth Service: /api/v1/auth/...
    location /api/v1/auth/ {
        proxy_pass http://auth_service/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Service: /api/v1/users/...
    location /api/v1/users/ {
        proxy_pass http://user_service/v1/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/Docs: /api/docs/...
    location /api/docs/ {
        proxy_pass http://swagger_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =================================================================
    # FRONTEND - Root path reserved for future frontend
    # =================================================================
    
    location = / {
        default_type application/json;
        return 200 '{"name":"Vizonomy API Gateway","version":"1.0.0","endpoints":{"auth":"/api/auth/","users":"/api/users/","docs":"/api/docs/","health":"/health"}}';
    }
}


