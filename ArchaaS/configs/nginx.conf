# Vizonomy API Gateway - Nginx Reverse Proxy
# All APIs follow pattern: /api/{service}/...

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream auth_service {
        server 127.0.0.1:5001;
    }

    upstream user_service {
        server 127.0.0.1:5002;
    }

    upstream swagger_service {
        server 127.0.0.1:3000;
    }

    upstream marker_service {
        server 127.0.0.1:8004;
    }

    upstream react_router {
        server 127.0.0.1:3001;
    }

    server {
    listen 80;
    server_name _;

    # Logging
    access_log /var/log/nginx/vizonomy_access.log;
    error_log /var/log/nginx/vizonomy_error.log;

    # Health check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    # =================================================================
    # API ROUTES - All follow /api/{service}/...
    # =================================================================

    # Auth Service: /api/auth/...
    location /api/auth/ {
        proxy_pass http://auth_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Service: /api/users/...
    location /api/users/ {
        proxy_pass http://user_service/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/Docs: /api/docs/... (legacy)
    location /api/docs/ {
        proxy_pass http://swagger_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/Docs: /docs and /docs/ (Swagger UI direct access)
    location /docs/ {
        proxy_pass http://swagger_service/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /docs to /docs/
    location = /docs {
        return 301 /docs/;
    }

    # Swagger API endpoints (/api/specs, /api/status, etc.)
    location /api/specs {
        proxy_pass http://swagger_service/api/specs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/status {
        proxy_pass http://swagger_service/api/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marker Service: /api/marker/...
    location /api/marker/ {
        proxy_pass http://marker_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # Long timeout for PDF conversion
    }

    # =================================================================
    # FRONTEND - Only serve at root, exclude /api routes
    # =================================================================
    # Frontend should ONLY handle non-API routes
    # All /api/* routes are handled by backend services above (more specific = higher priority)
    
    # Explicitly deny /api (exact match) - prevents React Router from handling it
    location = /api {
        return 404 '{"error":"Not Found","message":"API endpoint not found. Use /api/{service}/..."}';
        add_header Content-Type application/json;
    }
    
    # Redirect root to login page (React Router redirect not working in SSR)
    location = / {
        return 301 /login;
    }
    
    # Serve frontend via React Router server (SSR) - catch-all for non-API routes
    # Note: API routes above take precedence due to more specific location blocks
    location / {
        proxy_pass http://react_router;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
