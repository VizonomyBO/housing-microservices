[pytest]
addopts = --import-mode=importlib -m "not eval" -p no:pytest_flask -p no:flask -p no:pytest_flask.plugin
testpaths = services/agent-api/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning
