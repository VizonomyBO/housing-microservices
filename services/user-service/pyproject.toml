[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "UP", "N", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "RUF"]
extend-select = ["F401", "F811", "TID252"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
    "ISC001",  # Implicit string concatenation (conflicts with formatter)
    "ARG001",  # Unused function argument (common in test fixtures)
    "ARG002",  # Unused method argument (common in test fixtures)
    "ARG003",  # Unused class method argument (factory pattern)
    "PT003",  # Pytest fixture scope (function is implied)
    "RET504",  # Unnecessary assignment before return (minor style)
    "PLR0911",  # Too many return statements (acceptable for complex logic)
    "PLR0912",  # Too many branches (acceptable for complex logic)
    "RUF012",  # Mutable class attributes (Flask config pattern)
    "N818",  # Exception name should end with Error (legacy naming)
    "PLW1508",  # Invalid type for env var default (acceptable pattern)
    "PLW0603",  # Global statement for database initialization (acceptable pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = true

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
