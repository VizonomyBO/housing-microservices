[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing

markers =
    unit: Unit tests
    integration: Integration tests

