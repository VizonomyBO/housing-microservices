[project]
name = "websocket-service"
version = "0.1.0"
description = "WebSocket status service for document reprocessing"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "websockets>=13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "pyjwt>=2.8.0",
  "shared-data-layer",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
shared-data-layer = { path = "../../packages/shared_data_layer", editable = true }

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-xdist>=3.6.0",
  "ty>=0.0.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
