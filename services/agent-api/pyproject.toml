[project]
name = "agent-api"
version = "0.2.0"
description = "FastAPI gateway with LangGraph ReAct agent and tools"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "shared-data-layer",
  "openai>=1.42.0",
  "voyageai>=0.3.7",
  "langgraph>=1.0.5",
  "langchain>=1.2.0",
  "langchain-openai>=1.1.4",
  "numpy>=1.26.4",
  "prometheus-client>=0.20.0",
  "tenacity>=9.1.2",
  "authlib>=1.3.2",
  "python-jose[cryptography]>=3.3.0",
  "pgvector>=0.2.5",
  "testcontainers>=4.7.2",
  "polyfactory>=2.0.0",
  "langchain-voyageai>=0.3.0",
  "jinja2>=3.1.0",
  "weasyprint>=62.0",
  "markdown>=3.6.0",
  "boto3>=1.35.0",
  "python-multipart>=0.0.9",
  "python-dateutil>=2.9.0",
  "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=1.3.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a28",
  "respx>=0.22.0",
  "httpx>=0.27.0",
  "testcontainers>=4.7.2",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "UP", "N", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "RUF"]
ignore = [
  "E501",
  "PLR0913",
  "PLR2004",
  "ISC001",
  "PLR0911",
  "PLR0915",
  "DTZ003",
  "DTZ006",
  "N818",
  "RET504",
  "ARG001",
  "ARG002",
  "ARG003",
  "RUF012",
  "PLC0415",  # Allow imports inside functions (lazy imports to avoid circular deps)
  "B008",     # Allow Depends() and File() in FastAPI function defaults
  "A002",     # Allow shadowing builtins in specific contexts (globals, locals params)
  "PLR0912",  # Allow many branches in complex validation functions
  "PLW2901",  # Allow loop variable reassignment
  "N806",     # Allow uppercase variable names for constants in functions (BATCH_SIZE)
  "PTH108",   # Allow os.unlink() usage
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "PLR0913", "ARG001", "ARG002", "ARG003", "RUF059"]
"**/tests/**/*" = ["PLR2004", "PLR0913", "ARG001", "ARG002", "ARG003", "RUF059"]

[tool.uv.sources]
shared-data-layer = { path = "../../packages/shared_data_layer", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=1.3.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a28",
  "respx>=0.22.0",
  "httpx>=0.27.0",
]
