[project]
name = "agent-api"
version = "0.1.0"
description = "LangGraph agent microservice"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "langchain-core>=0.2.33",
  "pydantic>=2.7.0",
  "pytest-asyncio>=1.3.0",
  "lingua-language-detector>=2.0.2",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "polyfactory>=2.0.0",
  "shared-data-layer",
  "testcontainers[postgresql]>=4.0.0",
  "polars>=1.35.2",
  "uvicorn>=0.30.0",
  "valkey>=6.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a28",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "UP", "N", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "RUF"]
ignore = [
  "E501",
  "PLR0913",
  "PLR2004",
  "ISC001",
  "PLR0911",
  "PLR0915",
  "DTZ003",
  "DTZ006",
  "N818",
  "RET504",
  "ARG001",
  "ARG002",
  "ARG003",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "PLR0913", "ARG001", "ARG002", "ARG003"]

[tool.uv.sources]
shared-data-layer = { path = "../../packages/shared_data_layer", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a28",
  "httpx>=0.27.0",
]
