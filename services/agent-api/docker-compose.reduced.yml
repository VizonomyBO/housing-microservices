name: agent-api-reduced
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-api-reduced-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_API_DB:-agent_reduced}
      POSTGRES_USER: ${AGENT_API_DB_USER:-agent_api}
      POSTGRES_PASSWORD: ${AGENT_API_DB_PASSWORD:-agent_api_pass}
    ports:
      - "${AGENT_API_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_API_DB_USER:-agent_api} -d ${AGENT_API_DB:-agent_reduced}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - agent_api_pg_data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - agent_api_net

  db-init:
    build:
      context: ../..
      dockerfile: services/agent-api/Dockerfile.reduced
    profiles: ["init", "default"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    env_file:
      - .env.reduced
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agent_api:agent_api_pass@postgres:5432/agent_reduced}
    command: >-
      bash -c "uv run alembic -c ../packages/shared_data_layer/src/shared_data_layer/migrations/alembic.ini upgrade head && uv run python scripts/seed_reduced_scope_data.py --if-empty"
    networks:
      - agent_api_net

  agent-api:
    build:
      context: ../..
      dockerfile: services/agent-api/Dockerfile.reduced
    env_file:
      - .env.reduced
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${AGENT_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agent_api:agent_api_pass@postgres:5432/agent_reduced}
    networks:
      - agent_api_net

  db-shell:
    image: postgres:16
    profiles: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bash", "-c", "sleep infinity"]
    env_file:
      - .env.reduced
    environment:
      PGPASSWORD: ${AGENT_API_DB_PASSWORD:-agent_api_pass}
    networks:
      - agent_api_net

networks:
  agent_api_net:
    driver: bridge

volumes:
  agent_api_pg_data:
    name: agent_api_pg_data
