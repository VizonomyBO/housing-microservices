<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ country }} Housing Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Running header - removed from flow, placed in page margin */
        .running-header {
            position: running(pageHeader);
        }

        @page {
            size: A4;
            margin: 55mm 20mm 25mm 20mm;

            @top-left {
                content: element(pageHeader);
                vertical-align: top;
                width: 100%;
            }

            @bottom-left {
                content: "Page " counter(page) " of " counter(pages);
                font-family: "Open Sans", sans-serif;
                font-size: 10pt;
                color: rgba(0, 13, 26, 0.7);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Open Sans", sans-serif;
            color: #000;
            font-size: 11pt;
            line-height: 1.5;
            background: #fff;
        }

        /* Running header container */
        .running-header {
            width: 170mm;
            background: #fff;
        }

        /* Dark top bar */
        .top-bar {
            background-color: #181f25;
            height: 6mm;
            width: 210mm;
            margin-left: -20mm;
            margin-bottom: 8mm;
        }

        /* Header content */
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-left {
            flex: 1;
        }

        .report-date {
            font-size: 11pt;
            font-weight: 700;
            color: rgba(0, 13, 26, 0.7);
            margin-bottom: 2px;
        }

        .country-name {
            font-size: 36pt;
            font-weight: 600;
            color: #004370;
            line-height: 1.2;
            text-transform: capitalize;
            margin-bottom: 4px;
        }

        .report-title {
            font-size: 14pt;
            font-weight: 700;
            color: #000d1a;
            line-height: 1.4;
        }

        .header-logo {
            width: 150px;
            height: auto;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            bottom: -20mm;
            right: -20mm;
            width: 120mm;
            height: 120mm;
            opacity: 1;
            pointer-events: none;
            z-index: -1;
        }

        .watermark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Section styles */
        .section {
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 12pt;
            font-weight: 700;
            color: #009fda;
            margin-bottom: 5px;
            letter-spacing: 0.02em;
        }

        .section-content {
            padding-left: 16px;
            font-size: 10pt;
            line-height: 1.5;
            color: #000;
        }

        .section-content p {
            margin-bottom: 5px;
            text-align: left;
        }

        .section-content strong,
        .section-content b {
            font-weight: 700;
        }

        .section-content ul,
        .section-content ol {
            margin-left: 16px;
            margin-bottom: 5px;
        }

        .section-content li {
            margin-bottom: 2px;
            line-height: 1.5;
        }

        .section-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 9pt;
        }

        .section-content th {
            background-color: #004370;
            color: white;
            padding: 5px 7px;
            text-align: left;
            font-weight: 600;
        }

        .section-content td {
            padding: 5px 7px;
            border-bottom: 1px solid #e0e0e0;
        }

        .section-content tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .section-content h3 {
            font-size: 10pt;
            font-weight: 700;
            color: #004370;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .section-content h4 {
            font-size: 10pt;
            font-weight: 700;
            color: #000d1a;
            margin-top: 6px;
            margin-bottom: 3px;
        }

        /* References section */
        .references {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        .references-title {
            font-size: 12pt;
            font-weight: 700;
            color: #009fda;
            margin-bottom: 8px;
        }

        .reference-item {
            margin-bottom: 5px;
            font-size: 9pt;
            line-height: 1.4;
        }

        .reference-id {
            font-weight: bold;
            color: #0071bc;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .top-bar {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>

    <!-- Running header (appears on every page) -->
    <div class="running-header">
        <div class="top-bar"></div>
        <div class="header-content">
            <div class="header-left">
                <div class="report-date">{{ date }}</div>
                <div class="country-name">{{ country }}</div>
                <div class="report-title">AI-Generated Housing Assessment Diagnostic Report</div>
            </div>
            <img src="https://housing-public-content.s3.us-east-1.amazonaws.com/images/logos/world-bank-logo.png" class="header-logo" alt="World Bank Group" />
        </div>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        <img src="https://housing-public-content.s3.us-east-1.amazonaws.com/images/logos/watermark.png" alt="" />
    </div>

    <!-- Report sections -->
    {% for section in sections %}
    <div class="section">
        <div class="section-title">{{ section.title }}</div>
        <div class="section-content">
            {{ section.content | safe }}
        </div>
    </div>
    {% endfor %}

    {% if references %}
    <div class="references">
        <div class="references-title">References</div>
        {% for ref in references %}
        <div class="reference-item">
            <span class="reference-id">[c{{ loop.index }}]</span> {{ ref.document_name }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

</body>

</html>
