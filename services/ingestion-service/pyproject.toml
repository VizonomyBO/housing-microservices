[project]
name = "ingestion-service"
version = "0.1.0"
description = "Synchronous FastAPI ingestion service (MarkItDown + chunk/embed + activation)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "markitdown==0.0.1",
  "voyageai>=0.3.7",
  "tenacity>=9.1.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "pyjwt>=2.8.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.9",
  "shared-data-layer",
  "langchain-text-splitters>=1.0.0",
  "langchain-voyageai>=0.3.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
shared-data-layer = { path = "../../packages/shared_data_layer", editable = true }

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ty>=0.0.2",
]
