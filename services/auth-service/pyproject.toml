[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "UP", "N", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "RUF"]
extend-select = ["F401", "F811", "TID252"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value used in comparison
    "ISC001",  # Conflicts with formatter
    "PLR0911",  # Too many return statements (acceptable for complex functions)
    "PLR0915",  # Too many statements (acceptable for complex validation functions)
    "PLW1508",  # Invalid type for env var default (int() and timedelta() are fine)
    "DTZ003",  # datetime.utcnow() used (acceptable pattern)
    "DTZ006",  # fromtimestamp without tz (acceptable in tests)
    "N818",  # Exception name should end with Error (style preference)
    "RET504",  # Unnecessary assignment before return (minor style)
    "PT003",  # scope='function' is implied (explicit is fine)
    "ARG001",  # Unused function argument (common in pytest fixtures)
    "ARG002",  # Unused method argument (common in pytest fixtures)
    "ARG003",  # Unused class method argument (acceptable)
    "RUF012",  # Mutable class attributes (acceptable for config classes)
    "RUF015",  # Prefer next() over slice (minor style preference)
    "B017",  # pytest.raises(Exception) (acceptable in tests)
    "PT011",  # pytest.raises too broad (acceptable in tests)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = true

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
