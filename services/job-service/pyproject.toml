[project]
name = "job-service"
version = "0.1.0"
description = "Scheduled job service for housing microservices - handles report pre-generation and other scheduled tasks"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "apscheduler>=3.10.0",
  "python-dateutil>=2.9.0",
  "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.6.0",
  "respx>=0.22.0",
  "ty>=0.0.1a28",
  "pytest-xdist>=3.6.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A", "C4", "T10", "ISC", "PIE", "PT", "RET", "SIM", "RUF"]
ignore = ["E501", "ISC001", "RET504"]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.6.0",
  "respx>=0.22.0",
  "pytest-xdist>=3.6.0",
]

