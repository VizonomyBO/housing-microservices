version: '3.8'

services:
  # Test database for account service
  test-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: test_account_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # Account service test stage
  auth-service-test:
    build:
      context: ./services/auth-service
      target: test
    depends_on:
      test-postgres:
        condition: service_healthy
    environment:
      - AUTH_DATABASE_URL=postgresql://test_user:test_password@test-postgres:5432/test_account_db
      - JWT_SECRET_KEY=test-secret-key
      - JWT_ACCESS_TOKEN_EXPIRES=900
      - JWT_REFRESH_TOKEN_EXPIRES=2592000
    command: >
      uv run pytest tests/ -v --cov=app --cov-report=term --cov-report=xml --cov-report=html
